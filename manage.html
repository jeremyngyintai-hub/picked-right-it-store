<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>揀啱 · 產品管理</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f2eef4; --card:#fbf9fb; --ink:#1f1726; --ink-soft:#726a78;
    --accent-a:#ff3d7a; --accent-b:#5b3df5;
    --accent-grad:linear-gradient(135deg,var(--accent-a),var(--accent-b));
    --line:#ddd5df; --ok:#2e9e5b; --ok-bg:#e5f4ea; --err:#b3372f; --err-bg:#fbe9e9; --warn:#c97b1d;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans TC','Inter',sans-serif;line-height:1.6;}
  a{color:inherit;text-decoration:none;}
  .topbar{position:sticky;top:0;z-index:20;background:rgba(242,238,244,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);}
  .topbar-inner{max-width:1140px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:12px;}
  .brand-mark{width:36px;height:36px;position:relative;flex:none;color:var(--accent-a);}
  .brand-mark svg{position:absolute;inset:0;width:100%;height:100%;}
  .brand-mark span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif TC',serif;font-weight:600;font-size:1rem;color:var(--ink);}
  .brand-text b{font-family:'Noto Serif TC',serif;font-size:1.05rem;font-weight:600;display:block;line-height:1.15;}
  .brand-text em{font-style:normal;font-family:'Inter',sans-serif;font-size:.58rem;letter-spacing:.22em;color:var(--ink-soft);}
  .spacer{flex:1;}
  .nav-link{font-size:.8rem;color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;padding:8px 16px;transition:all .15s;}
  .nav-link:hover{color:var(--ink);border-color:var(--ink);}

  .wrap{max-width:1140px;margin:0 auto;padding:28px 20px 120px;}
  h1{font-family:'Noto Serif TC',serif;font-size:1.5rem;margin:0 0 4px;font-weight:600;}
  .sub{color:var(--ink-soft);font-size:.86rem;margin-bottom:24px;}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:22px;box-shadow:0 2px 12px -6px rgba(31,23,38,.06);}
  label{display:block;font-size:.74rem;font-weight:700;color:var(--ink-soft);margin-bottom:7px;letter-spacing:.04em;}
  input{padding:11px 14px;border:1px solid var(--line);border-radius:12px;font-family:inherit;font-size:.9rem;background:#fff;transition:border-color .15s;}
  input:focus{outline:none;border-color:var(--accent-a);}
  .load-row{display:flex;gap:14px;align-items:end;flex-wrap:wrap;}
  .load-row input{flex:1;min-width:220px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border:none;border-radius:999px;background:var(--accent-grad);color:#fff;font-family:inherit;font-size:.86rem;font-weight:600;cursor:pointer;transition:filter .15s, transform .1s;box-shadow:0 8px 20px -8px rgba(255,61,122,.5);}
  .btn:hover{filter:brightness(.95);}
  .btn:active{transform:scale(.97);}
  .btn:disabled{opacity:.55;cursor:not-allowed;box-shadow:none;}
  .btn-ghost{background:none;color:var(--err);border:1px solid var(--line);box-shadow:none;padding:8px 14px;font-size:.76rem;}
  .btn-ghost:hover{border-color:var(--err);background:var(--err-bg);filter:none;}
  .status{margin-top:14px;font-size:.85rem;padding:12px 16px;border-radius:12px;display:none;}
  .status.ok{display:block;background:var(--ok-bg);color:var(--ok);}
  .status.err{display:block;background:var(--err-bg);color:var(--err);}

  /* product rows */
  .prow{display:grid;grid-template-columns:64px 1fr 130px 120px auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);}
  .prow:last-child{border-bottom:none;}
  .prow.deleted{opacity:.38;}
  .prow.deleted .pname-input{text-decoration:line-through;}
  .prow img{width:64px;height:64px;object-fit:cover;border-radius:12px;background:#efeaf1;}
  .pmain{min-width:0;}
  .pname-input{width:100%;font-size:.86rem;padding:9px 12px;}
  .pmeta{font-size:.7rem;color:var(--ink-soft);font-family:'Inter','Noto Sans TC',sans-serif;margin-top:5px;}
  .price-cell{display:flex;flex-direction:column;gap:4px;}
  .price-input{width:100%;font-family:'Inter',sans-serif;font-weight:700;text-align:right;}
  .price-input.changed{border-color:var(--warn);background:#fdf6ec;}
  .margin-cell{font-size:.72rem;font-family:'Inter','Noto Sans TC',sans-serif;color:var(--ok);font-weight:600;text-align:right;}
  .margin-cell.neg{color:var(--err);}

  /* sticky save bar */
  .savebar{position:fixed;left:0;right:0;bottom:0;background:rgba(251,249,251,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:14px 20px;padding-bottom:calc(14px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .3s ease;z-index:30;}
  .savebar.show{transform:none;}
  .savebar-inner{max-width:1140px;margin:0 auto;display:flex;align-items:center;gap:16px;}
  .savebar .changes{font-size:.84rem;color:var(--ink-soft);flex:1;}
  .savebar .changes b{color:var(--warn);}

  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:13px 22px;border-radius:999px;font-size:.84rem;opacity:0;pointer-events:none;transition:all .3s ease;z-index:50;box-shadow:0 12px 30px rgba(0,0,0,.25);max-width:90vw;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.ok{background:var(--ok);}
  .toast.err{background:var(--err);}
  .empty{color:var(--ink-soft);font-size:.88rem;padding:40px 0;text-align:center;}
  .skel{background:linear-gradient(90deg,#e9e3ec 25%,#f4f0f6 50%,#e9e3ec 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:14px;height:80px;margin-bottom:12px;}
  @keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}

  @media(max-width:720px){
    .prow{grid-template-columns:52px 1fr;grid-template-rows:auto auto;}
    .prow img{width:52px;height:52px;grid-row:span 2;}
    .price-cell{grid-column:2;flex-direction:row;align-items:center;gap:10px;}
    .price-input{max-width:110px;}
    .prow .btn-ghost{grid-column:2;justify-self:start;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <span class="brand-mark">
      <svg viewBox="0 0 100 100"><path d="M50,8 C22,6 6,28 8,50 C10,74 28,92 52,90 C76,92 94,70 92,46 C90,20 74,6 50,8 Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>
      <span>揀</span>
    </span>
    <span class="brand-text"><b>產品管理</b><em>PRODUCT&nbsp;MANAGER</em></span>
    <span class="spacer"></span>
    <a class="nav-link" href="/admin.html">🔍 搵贏家</a>
    <a class="nav-link" href="/" target="_blank">開啟商店 ↗</a>
  </div>
</div>

<div class="wrap">
  <h1>已上架產品管理</h1>
  <p class="sub">改價、改名、落架,全部一次過儲存(一個commit)。約1分鐘後自動套用到商店。</p>

  <div class="panel">
    <div class="load-row">
      <div style="flex:1">
        <label>管理密碼</label>
        <input type="password" id="secret" placeholder="ADMIN_SYNC_SECRET" autocomplete="off" style="width:100%">
      </div>
      <button class="btn" id="loadBtn" onclick="loadProducts()">載入產品清單</button>
    </div>
    <div class="status" id="topStatus"></div>
  </div>

  <div class="panel" id="listPanel" style="display:none">
    <div id="plist"></div>
  </div>
</div>

<div class="savebar" id="savebar">
  <div class="savebar-inner">
    <span class="changes" id="changesSummary"></span>
    <button class="btn btn-ghost" onclick="resetChanges()" style="color:var(--ink-soft)">還原</button>
    <button class="btn" id="saveBtn" onclick="saveAll()">💾 一次過儲存</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const USD_TO_HKD = 7.8;
let original = [];   // 由server載入嘅原始版本
let working = [];    // 編輯中嘅版本(deleted flag標記落架)

function setStatus(msg, type){
  const el = document.getElementById('topStatus');
  el.textContent = msg;
  el.className = 'status ' + type;
}
let toastTimer;
function toast(msg, type){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + (type||'');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.className = 'toast'; }, 3200);
}

async function loadProducts(){
  const secret = document.getElementById('secret').value.trim();
  if(!secret){ setStatus('請先輸入管理密碼','err'); return; }
  const btn = document.getElementById('loadBtn');
  btn.disabled = true; btn.textContent = '載入緊...';
  document.getElementById('listPanel').style.display = 'block';
  document.getElementById('plist').innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  try{
    const res = await fetch(`/api/admin/manage-products?secret=${encodeURIComponent(secret)}`);
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    original = data.products || [];
    working = JSON.parse(JSON.stringify(original)).map(p => ({...p, _deleted:false}));
    document.getElementById('topStatus').className = 'status';
    renderList();
    if(original.length === 0){
      setStatus('暫時未有經管理台上架嘅產品。去「搵贏家」上架第一件先。','ok');
    }
  }catch(e){
    setStatus('載入失敗:' + e.message, 'err');
    document.getElementById('plist').innerHTML = '';
  }finally{
    btn.disabled = false; btn.textContent = '載入產品清單';
  }
}

function renderList(){
  const box = document.getElementById('plist');
  if(working.length === 0){ box.innerHTML = '<p class="empty">未有產品。</p>'; updateSavebar(); return; }
  box.innerHTML = working.map((p, i) => {
    const name = (p.i18n && p.i18n['zh-Hant'] && p.i18n['zh-Hant'].name) || '';
    const costHKD = p.costUSD ? Math.round(p.costUSD * USD_TO_HKD) : null;
    const margin = costHKD != null ? p.price - costHKD : null;
    return `
    <div class="prow ${p._deleted?'deleted':''}" id="row-${i}">
      <img src="${p.image||''}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
      <div class="pmain">
        <input class="pname-input" value="${name.replace(/"/g,'&quot;')}" oninput="editName(${i}, this.value)" ${p._deleted?'disabled':''}>
        <div class="pmeta">#${p.id} · ${p.catClass} · 成本 ${costHKD!=null?('HK$'+costHKD):'?'} · ${p.addedAt ? p.addedAt.slice(0,10) : ''}</div>
      </div>
      <div class="price-cell">
        <input type="number" class="price-input ${isPriceChanged(i)?'changed':''}" value="${p.price}" min="1" oninput="editPrice(${i}, this)" ${p._deleted?'disabled':''}>
        <span class="margin-cell ${margin!=null&&margin<0?'neg':''}" id="margin-${i}">${margin!=null?('毛利 HK$'+margin):''}</span>
      </div>
      <div></div>
      <button class="btn-ghost btn" onclick="toggleDelete(${i}, this)">${p._deleted?'還原':'落架'}</button>
    </div>`;
  }).join('');
  updateSavebar();
}

function isPriceChanged(i){
  const orig = original[i];
  return orig && working[i].price !== orig.price;
}
function editName(i, val){
  if(!working[i].i18n) working[i].i18n = {'zh-Hant':{},'zh-Hans':{},'en':{}};
  working[i].i18n['zh-Hant'].name = val;
  updateSavebar();
}
function editPrice(i, inputEl){
  const val = parseInt(inputEl.value) || 0;
  working[i].price = val;
  inputEl.classList.toggle('changed', isPriceChanged(i));
  const costHKD = working[i].costUSD ? Math.round(working[i].costUSD * USD_TO_HKD) : null;
  const marginEl = document.getElementById('margin-'+i);
  if(costHKD != null && marginEl){
    const m = val - costHKD;
    marginEl.textContent = '毛利 HK$' + m;
    marginEl.classList.toggle('neg', m < 0);
  }
  updateSavebar();
}
function toggleDelete(i){
  working[i]._deleted = !working[i]._deleted;
  renderList();
}

function countChanges(){
  let priceChanges = 0, nameChanges = 0, deletions = 0;
  working.forEach((p, i) => {
    const o = original[i];
    if(!o) return;
    if(p._deleted){ deletions++; return; }
    if(p.price !== o.price) priceChanges++;
    const n1 = (p.i18n&&p.i18n['zh-Hant']&&p.i18n['zh-Hant'].name)||'';
    const n2 = (o.i18n&&o.i18n['zh-Hant']&&o.i18n['zh-Hant'].name)||'';
    if(n1 !== n2) nameChanges++;
  });
  return {priceChanges, nameChanges, deletions, total: priceChanges+nameChanges+deletions};
}
function updateSavebar(){
  const c = countChanges();
  const bar = document.getElementById('savebar');
  if(c.total === 0){ bar.classList.remove('show'); return; }
  const parts = [];
  if(c.priceChanges) parts.push(`改價 ${c.priceChanges} 件`);
  if(c.nameChanges) parts.push(`改名 ${c.nameChanges} 件`);
  if(c.deletions) parts.push(`落架 ${c.deletions} 件`);
  document.getElementById('changesSummary').innerHTML = `未儲存改動:<b>${parts.join(' · ')}</b>`;
  bar.classList.add('show');
}
function resetChanges(){
  working = JSON.parse(JSON.stringify(original)).map(p => ({...p, _deleted:false}));
  renderList();
  toast('已還原所有改動');
}

async function saveAll(){
  const secret = document.getElementById('secret').value.trim();
  const c = countChanges();
  if(c.deletions > 0 && !confirm(`確定要落架 ${c.deletions} 件產品?落架後客人就買唔到。`)) return;
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = '儲存緊...';
  try{
    const finalList = working
      .filter(p => !p._deleted)
      .map(({_deleted, ...p}) => p);
    const res = await fetch('/api/admin/manage-products', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ secret, products: finalList })
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    original = JSON.parse(JSON.stringify(finalList));
    working = finalList.map(p => ({...p, _deleted:false}));
    renderList();
    toast(`✓ 已儲存 ${data.count} 件產品。約1分鐘後生效。`,'ok');
  }catch(e){
    toast('儲存失敗:' + e.message,'err');
  }finally{
    btn.disabled = false; btn.textContent = '💾 一次過儲存';
  }
}
</script>
</body>
</html>
