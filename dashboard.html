<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>揀啱 · Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0b0812; --bg2:#120d1c;
    --panel:rgba(255,255,255,.045); --panel2:rgba(255,255,255,.07);
    --line:rgba(255,255,255,.1); --line2:rgba(255,255,255,.18);
    --tx:#efeaf6; --tx-soft:#9a92a8;
    --pink:#ff3d7a; --violet:#8b5cf6; --cyan:#3de0ff; --num:#3de0ff; --numglow:rgba(61,224,255,.5); --ok:#3ddc84; --warn:#ffb547; --err:#ff5c5c;
    --grad:linear-gradient(135deg,var(--pink),var(--violet));
    --mono:'JetBrains Mono',monospace;
  }
  [data-theme="light"]{
    --bg:#f2eef4; --bg2:#ffffff;
    --panel:rgba(31,23,38,.035); --panel2:rgba(31,23,38,.06);
    --line:rgba(31,23,38,.12); --line2:rgba(31,23,38,.22);
    --tx:#241a2e; --tx-soft:#6f6680;
    --num:#0b8fb5; --numglow:rgba(11,143,181,.25);
    --ok:#1f9d55; --warn:#b97a10; --err:#d13c3c;
  }
  [data-theme="light"] body::before{opacity:.5;}
  [data-theme="light"] .topbar{background:rgba(242,238,244,.85);}
  [data-theme="light"] .field input, [data-theme="light"] .name-in, [data-theme="light"] .price-in{background:#fff;}
  [data-theme="light"] .schip{background:#fff;}
  [data-theme="light"] .btn-dark{background:rgba(31,23,38,.06);}
  [data-theme="light"] .btn-dark:hover{background:rgba(31,23,38,.11);}
  [data-theme="light"] .pcard .imgbox, [data-theme="light"] .prow img{background:#eee6ef;}
  [data-theme="light"] .floatbar{background:rgba(255,255,255,.94);}
  [data-theme="light"] .toast{background:#fff;color:var(--tx);}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Sans TC','Inter',sans-serif;line-height:1.6;min-height:100vh;
    background-image:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(139,92,246,.16),transparent),
      radial-gradient(ellipse 60% 40% at 90% 110%,rgba(255,61,122,.1),transparent);}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:44px 44px;mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 30%,transparent 80%);}
  a{color:inherit;text-decoration:none;}
  input,select,button{font-family:inherit;}
  ::placeholder{color:var(--tx-soft);opacity:.6;}

  .topbar{position:sticky;top:0;z-index:30;background:rgba(11,8,18,.8);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);}
  .topbar-inner{max-width:1280px;margin:0 auto;padding:13px 22px;display:flex;align-items:center;gap:14px;}
  .brand-mark{width:36px;height:36px;position:relative;flex:none;color:var(--pink);filter:drop-shadow(0 0 8px rgba(255,61,122,.6));}
  .brand-mark svg{position:absolute;inset:0;width:100%;height:100%;}
  .brand-mark span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif TC',serif;font-weight:600;font-size:1rem;color:var(--tx);}
  .brand-text b{font-family:'Noto Serif TC',serif;font-size:1.02rem;display:block;line-height:1.1;}
  .brand-text em{font-style:normal;font-family:var(--mono);font-size:.56rem;letter-spacing:.3em;color:var(--num);}
  .spacer{flex:1;}
  .live-dot{display:flex;align-items:center;gap:7px;font-size:.72rem;font-family:var(--mono);color:var(--tx-soft);}
  .live-dot i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .nav-link{font-size:.78rem;color:var(--tx-soft);border:1px solid var(--line);border-radius:999px;padding:8px 16px;transition:all .15s;}
  .nav-link:hover{color:var(--tx);border-color:var(--line2);background:var(--panel);}

  .wrap{max-width:1280px;margin:0 auto;padding:26px 22px 140px;position:relative;z-index:1;}

  /* command bar */
  .cmdbar{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;grid-template-columns:1fr .55fr .55fr auto auto;gap:12px;align-items:end;backdrop-filter:blur(6px);}
  label{display:block;font-size:.66rem;font-weight:700;color:var(--tx-soft);margin-bottom:6px;letter-spacing:.14em;text-transform:uppercase;font-family:var(--mono);}
  .field input{width:100%;padding:12px 15px;border:1px solid var(--line);border-radius:12px;font-size:.9rem;background:rgba(0,0,0,.3);color:var(--tx);transition:all .15s;}
  .field input:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px rgba(139,92,246,.18);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border:none;border-radius:12px;background:var(--grad);color:#fff;font-size:.86rem;font-weight:700;cursor:pointer;transition:all .15s;box-shadow:0 0 24px -6px rgba(255,61,122,.55);}
  .btn:hover{transform:translateY(-1px);box-shadow:0 0 32px -4px rgba(255,61,122,.7);}
  .btn:active{transform:none;}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none;}
  .btn-dark{background:rgba(255,255,255,.08);box-shadow:none;border:1px solid var(--line);}
  .btn-dark:hover{background:rgba(255,255,255,.13);box-shadow:none;}
  .btn-sm{padding:9px 16px;font-size:.78rem;border-radius:10px;}

  /* tabs */
  .mode-tabs{display:flex;gap:6px;margin:22px 0 18px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:5px;width:fit-content;}
  .mode-tab{padding:10px 26px;border-radius:10px;border:none;background:none;color:var(--tx-soft);font-size:.86rem;font-weight:600;cursor:pointer;transition:all .2s;}
  .mode-tab.on{background:var(--grad);color:#fff;box-shadow:0 0 18px -4px rgba(255,61,122,.6);}

  .status{margin-top:12px;font-size:.83rem;padding:11px 15px;border-radius:12px;display:none;white-space:pre-wrap;font-family:var(--mono);font-size:.76rem;}
  .status.ok{display:block;background:rgba(61,220,132,.1);color:var(--ok);border:1px solid rgba(61,220,132,.25);}
  .status.err{display:block;background:rgba(255,92,92,.1);color:var(--err);border:1px solid rgba(255,92,92,.25);}

  .stat-strip{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;display:none;}
  .stat-strip.show{display:flex;}
  .schip{font-family:var(--mono);font-size:.72rem;border:1px solid var(--line);background:rgba(0,0,0,.25);border-radius:999px;padding:7px 14px;color:var(--tx-soft);}
  .schip b{color:var(--num);}

  /* discover grid */
  .cat-tabs{display:none;gap:8px;margin:4px 0 14px;flex-wrap:wrap;align-items:center;}
  .cat-tabs.show{display:flex;}
  .cat-tab{padding:8px 20px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:.82rem;font-weight:600;cursor:pointer;color:var(--tx-soft);transition:all .15s;}
  .cat-tab.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 0 16px -4px rgba(255,61,122,.55);}
  .selall{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--tx-soft);cursor:pointer;user-select:none;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px;}
  .pcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:all .2s;position:relative;}
  .pcard:hover{border-color:rgba(139,92,246,.55);box-shadow:0 0 28px -8px rgba(139,92,246,.45);transform:translateY(-2px);}
  .pcard.selected{border-color:var(--pink);box-shadow:0 0 24px -6px rgba(255,61,122,.55);}
  .pcard .imgbox{aspect-ratio:1;overflow:hidden;background:#1a1424;position:relative;cursor:pointer;}
  .pcard img{width:100%;height:100%;object-fit:cover;transition:transform .35s;}
  .pcard:hover img{transform:scale(1.05);}
  .sel-check{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:8px;border:2px solid rgba(255,255,255,.6);background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;color:transparent;font-size:.8rem;font-weight:800;transition:all .15s;z-index:2;}
  .pcard.selected .sel-check{background:var(--grad);border-color:transparent;color:#fff;}
  .hot-tag{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);color:var(--warn);font-size:.6rem;font-weight:700;letter-spacing:.06em;padding:4px 9px;border-radius:999px;font-family:var(--mono);border:1px solid rgba(255,181,71,.4);}
  .pcard .pi{padding:12px 13px 13px;display:flex;flex-direction:column;gap:6px;flex:1;}
  .pname{font-size:.76rem;line-height:1.45;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.2em;color:var(--tx);}
  .meta{font-size:.66rem;color:var(--tx-soft);font-family:var(--mono);}
  .prices{display:flex;justify-content:space-between;align-items:baseline;}
  .prices .lbl{font-size:.7rem;color:var(--tx-soft);}
  .sell{font-family:var(--mono);font-weight:600;font-size:1rem;color:var(--num);text-shadow:0 0 12px var(--numglow);}
  .margin-tag{font-size:.66rem;font-family:var(--mono);color:var(--ok);}

  .loadmore-row{margin:18px 0 0;text-align:center;}

  /* skeleton */
  .skel{background:linear-gradient(90deg,rgba(255,255,255,.05) 25%,rgba(255,255,255,.1) 50%,rgba(255,255,255,.05) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:16px;height:320px;}
  @keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}

  /* manage rows */
  .mpanel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:8px 20px;}
  .prow{display:grid;grid-template-columns:26px 56px 1fr 200px 90px;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);}
  .mchk{width:18px;height:18px;accent-color:#ff3d7a;cursor:pointer;}
  .mtoolbar-left{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--tx-soft);margin-right:auto;white-space:nowrap;}
  .prow:last-child{border-bottom:none;}
  .prow.deleted{opacity:.35;}
  .prow.deleted .name-in{text-decoration:line-through;}
  .prow img{width:56px;height:56px;object-fit:cover;border-radius:12px;background:#1a1424;}
  .name-in{width:100%;font-size:.84rem;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.3);color:var(--tx);}
  .name-in:focus{outline:none;border-color:var(--violet);}
  .prow .rmeta{font-size:.64rem;color:var(--tx-soft);font-family:var(--mono);margin-top:4px;}
  .price-in{width:100%;font-family:var(--mono);font-weight:600;text-align:right;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.3);color:var(--num);}
  .price-in:focus{outline:none;border-color:var(--violet);}
  .price-in.changed{border-color:var(--warn);box-shadow:0 0 12px -4px rgba(255,181,71,.5);}
  .rmargin{font-size:.64rem;font-family:var(--mono);color:var(--ok);text-align:right;margin-top:4px;}
  .rmargin.neg{color:var(--err);}
  .del-btn{font-size:.72rem;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--tx-soft);cursor:pointer;transition:all .15s;}
  .del-btn:hover{color:var(--err);border-color:rgba(255,92,92,.5);}

  /* floating bars */
  .floatbar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(140%);transition:transform .3s;z-index:40;background:rgba(18,13,28,.92);backdrop-filter:blur(14px);border:1px solid var(--line2);border-radius:16px;padding:13px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 18px 44px rgba(0,0,0,.5);max-width:94vw;}
  .floatbar.show{transform:translateX(-50%) translateY(0);}
  .floatbar .fb-info{font-size:.82rem;color:var(--tx-soft);white-space:nowrap;}
  .floatbar .fb-info b{color:var(--pink);font-family:var(--mono);}

  .toast{position:fixed;left:50%;top:74px;transform:translateX(-50%) translateY(-16px);background:var(--bg2);border:1px solid var(--line2);color:var(--tx);padding:12px 22px;border-radius:12px;font-size:.82rem;opacity:0;pointer-events:none;transition:all .3s;z-index:60;box-shadow:0 14px 40px rgba(0,0,0,.5);max-width:90vw;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.ok{border-color:rgba(61,220,132,.5);color:var(--ok);}
  .toast.err{border-color:rgba(255,92,92,.5);color:var(--err);}
  .empty{color:var(--tx-soft);font-size:.86rem;padding:44px 0;text-align:center;font-family:var(--mono);}

  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px;}
  .chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .chart-card{padding:16px 18px 12px;}
  .chart-card canvas{max-height:220px;}
  .chart-title{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--tx-soft);font-family:var(--mono);margin-bottom:10px;}
  .pnl-row{display:grid;grid-template-columns:70px repeat(5,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:.74rem;align-items:center;}
  .pnl-row:last-child{border-bottom:none;}
  .pnl-row.head{color:var(--tx-soft);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;}
  .pnl-pos{color:var(--ok);} .pnl-neg{color:var(--err);}
  .perf-row{display:grid;grid-template-columns:1fr 80px 70px 100px 80px;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center;font-size:.8rem;}
  .perf-row:last-child{border-bottom:none;}
  .perf-row.head{color:var(--tx-soft);font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;}
  .perf-row .num{font-family:var(--mono);text-align:right;}
  .conv-hi{color:var(--ok);} .conv-lo{color:var(--warn);}
  @media(max-width:860px){.chart-grid{grid-template-columns:1fr;}.pnl-row{font-size:.64rem;}.perf-row{grid-template-columns:1fr 60px 50px;} .perf-row .hide-m{display:none;}}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;}
  .kpi .kl{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--tx-soft);font-family:var(--mono);}
  .kpi .kv{font-family:var(--mono);font-weight:600;font-size:1.5rem;color:var(--num);text-shadow:0 0 14px var(--numglow);margin-top:4px;}
  .srow{display:grid;grid-template-columns:1fr 120px 90px;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);}
  .srow:last-child{border-bottom:none;}
  .sbar-wrap{height:8px;background:rgba(0,0,0,.35);border-radius:99px;overflow:hidden;margin-top:6px;}
  .sbar{height:100%;background:var(--grad);border-radius:99px;box-shadow:0 0 10px rgba(255,61,122,.6);}
  .srow .sname{font-size:.82rem;}
  .srow .srev{font-family:var(--mono);font-weight:600;color:var(--num);text-align:right;}
  .srow .sqty{font-family:var(--mono);font-size:.76rem;color:var(--tx-soft);text-align:right;}
  .delist-badge{display:inline-block;font-size:.6rem;font-family:var(--mono);color:var(--warn);border:1px solid rgba(255,181,71,.4);border-radius:6px;padding:2px 7px;margin-top:4px;}
  @media(max-width:860px){.kpi-row{grid-template-columns:repeat(2,1fr);}}

  .qlink{font-family:var(--mono);font-size:.66rem;color:var(--num);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:2px 8px;transition:all .15s;white-space:nowrap;}
  .qlink:hover{border-color:var(--num);box-shadow:0 0 10px -2px var(--numglow);}
  .rlinks{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}

  /* ===== 手機優化 ===== */
  @media(max-width:680px){
    .topbar-inner{padding:10px 12px;gap:8px;}
    .live-dot{display:none;}
    .brand-text em{display:none;}
    .nav-link{padding:7px 11px;font-size:.72rem;}
    .wrap{padding:16px 12px 170px;}
    .cmdbar{grid-template-columns:1fr 1fr;padding:14px;gap:10px;}
    .cmdbar .field:first-child{grid-column:span 2;}
    .cmdbar>button{grid-column:span 1;}
    .cmdbar .btn{width:100%;padding:12px 10px;font-size:.8rem;}
    .mode-tabs{width:100%;display:flex;}
    .mode-tab{flex:1;padding:10px 6px;font-size:.78rem;text-align:center;}
    .cat-tabs.show{flex-wrap:nowrap;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
    .cat-tabs::-webkit-scrollbar{display:none;}
    .cat-tab{white-space:nowrap;flex:none;padding:8px 14px;font-size:.76rem;}
    .selall{white-space:nowrap;flex:none;margin-left:4px;}
    .grid{grid-template-columns:repeat(2,1fr);gap:10px;}
    .pcard .pi{padding:10px 11px 11px;gap:5px;}
    .pname{font-size:.7rem;}
    .sell{font-size:.88rem;}
    .btn-sm{padding:9px 10px;font-size:.72rem;}
    .floatbar{left:10px;right:10px;transform:translateY(150%);max-width:none;flex-wrap:wrap;justify-content:center;gap:10px;padding:12px;}
    .floatbar.show{transform:translateY(0);}
    .mpanel{padding:6px 12px;}
    .prow{grid-template-columns:22px 44px 1fr;}
    .prow img{grid-row:span 2;width:44px;height:44px;}
    .prow .mchk{grid-row:span 2;}
    .prow>div:nth-child(4){grid-column:3;}
    .prow>div:nth-child(5){grid-column:3;display:flex;flex-direction:row;gap:8px;}
    .kpi .kv{font-size:1.15rem;}
    .pnl-row{grid-template-columns:56px repeat(5,minmax(52px,1fr));font-size:.6rem;gap:6px;}
    .chart-card canvas{max-height:180px;}
  }

  .view{display:none;}
  .view.on{display:block;animation:fadeUp .35s ease;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  @media(max-width:860px){
    .cmdbar{grid-template-columns:1fr 1fr;}
    .cmdbar .btn{grid-column:span 1;width:100%;}
    .prow{grid-template-columns:48px 1fr;grid-template-rows:auto auto;}
    .prow img{grid-row:span 2;width:48px;height:48px;}
    .prow>div:nth-child(3){grid-column:2;}
    .prow .del-btn{grid-column:2;justify-self:start;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <span class="brand-mark">
      <svg viewBox="0 0 100 100"><path d="M50,8 C22,6 6,28 8,50 C10,74 28,92 52,90 C76,92 94,70 92,46 C90,20 74,6 50,8 Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>
      <span>揀</span>
    </span>
    <span class="brand-text"><b>Command Center</b><em>PICKED&nbsp;RIGHT&nbsp;IT</em></span>
    <span class="spacer"></span>
    <span class="live-dot"><i></i>SYSTEM ONLINE</span>
    <button class="nav-link" id="themeBtn" onclick="toggleTheme()" style="cursor:pointer;background:none">☀️</button>
    <button class="nav-link" id="langBtn" onclick="toggleDashLang()" style="cursor:pointer;background:none">EN</button>
    <a class="nav-link" href="/" target="_blank" data-dt="openStore">開啟商店 ↗</a>
  </div>
</div>

<div class="wrap">

  <!-- command bar -->
  <div class="cmdbar">
    <div class="field">
      <label data-dt="lblKey">Access Key · 管理密碼</label>
      <input type="password" id="secret" placeholder="ADMIN_SYNC_SECRET" autocomplete="off">
    </div>
    <div class="field">
      <label data-dt="lblMarkup">Markup · 利潤倍數</label>
      <input type="number" id="markup" value="2.8" step="0.1" min="1.2">
    </div>
    <div class="field">
      <label data-dt="lblShip">預估運費 US$/件</label>
      <input type="number" id="shipEst" value="5" step="0.5" min="0">
    </div>
    <button class="btn" id="scanBtn" onclick="loadWinners(1)" data-dt="btnScan">⚡ 掃描贏家產品</button>
    <button class="btn btn-dark" id="syncBtn" onclick="syncPrices()" data-dt="btnSync">🔄 同步CJ價格</button>
  </div>
  <div class="status" id="topStatus"></div>
  <div class="stat-strip" id="statStrip"></div>

  <!-- mode tabs -->
  <div class="mode-tabs">

      <div class="mpanel chart-card"><div class="chart-title" data-dt="chViewsT">30日瀏覽量趨勢</div><canvas id="chViews"></canvas></div>

      <div class="chart-title" style="padding-top:8px" data-dt="pnlT">近7日 P&L 明細</div>
      <div id="pnlTable"></div>
    </div>

      <div class="chart-title" style="padding-top:8px" data-dt="perfT">產品表現(瀏覽 → 銷量 → 轉換率)</div>
      <div id="prodPerf"><p class="empty">輸入密碼後撳「📊 銷售數據」會自動載入。</p></div>

</div>

<!-- batch import floating bar -->
<div class="floatbar" id="batchBar">
  <span class="fb-info" id="selCountWrap">已揀 <b id="selCount">0</b> 件</span>

<div class="floatbar" id="saveBar">

</div>

<div class="toast" id="toast"></div>

<script>
const USD_TO_HKD = 7.8;

/* ===== 主題 + 語言 ===== */
let DTHEME = 'dark', DLANG = 'zh';
try{ DTHEME = localStorage.getItem('dash-theme')||'dark'; DLANG = localStorage.getItem('dash-lang')||'zh'; }catch(e){}
const DI = {
 zh:{openStore:'開啟商店 ↗',pageTitle:'贏家產品管理台',pageSub:'搵CJ熱賣產品 → 設定利潤倍數 → 一撳上架,約1分鐘後自動live喺商店。',
  lblKey:'Access Key · 管理密碼',lblMarkup:'Markup · 利潤倍數',lblShip:'預估運費 US$/件',btnScan:'⚡ 掃描贏家產品',btnSync:'🔄 同步CJ價格',
  tabDiscover:'🛰 搵貨上架',tabManage:'📦 產品管理',tabSales:'📊 銷售數據',selAllLbl:'全選本頁',
  btnReload:'↻ 重新載入',btnCsv:'⬇ 匯出CSV',btnMaintain:'🧹 執行自動落架',btnClear:'清除',btnBatch:'🚀 批量上架',btnReset:'還原',btnSave:'💾 一次過儲存',
  chDailyT:'30日營業額 vs 毛利(每日)',chViewsT:'30日瀏覽量趨勢',chWeekT:'每週營業額(近8週)',chMonthT:'每月營業額(近6個月)',pnlT:'近7日 P&L 明細',perfT:'產品表現(瀏覽 → 銷量 → 轉換率)',
  scanning:'掃描緊...(9大類·約40秒)',needKey:'請先輸入管理密碼',loadMore:'載入更多結果(第',page:'頁)',selCountA:'已揀 ',selCountB:' 件',
  kRev:'30日營業額',kProfit:'30日毛利(扣成本+手續費)',kOrders:'30日訂單 / 平均單值',kViews:'30日瀏覽量 / 轉換率',
  colDate:'日期',colRev:'營業額',colCost:'貨品成本',colFee:'手續費(估)',colProfit:'毛利',colOrders:'訂單',
  colProduct:'產品',colViews:'瀏覽',colQty:'銷量',colConv:'轉換率',margin:'毛利',sold:'賣出',pcs:'件',linkCJ:'CJ原頁 ↗',linkStore:'商店頁 ↗',shipLbl:'運',inclShip:'(連運)',mSelAllLbl:'全選',btnDelistSel:'🗑 落架已選',noneSelected:'未揀任何產品',markedDelist:'已標記 ',markedDelist2:' 件落架 — 記得撳「儲存」先生效',
  catHome:'🏠 家居',catBeauty:'💄 美妝',catTech:'⚡ 電子',catPets:'🐾 寵物',catBaby:'🧸 母嬰玩具',catSports:'⛺ 運動戶外',catAccessories:'💍 飾物配件',catBags:'👜 袋&鞋',catAuto:'🚗 汽車用品'},
 en:{openStore:'Open Store ↗',pageTitle:'Winner Product Console',pageSub:'Scan CJ bestsellers → set your markup → one-click import. Live on the store in ~1 minute.',
  lblKey:'Access Key',lblMarkup:'Markup Multiplier',lblShip:'Est. Shipping US$/pc',btnScan:'⚡ Scan Winners',btnSync:'🔄 Sync CJ Prices',
  tabDiscover:'🛰 Discover',tabManage:'📦 Products',tabSales:'📊 Analytics',selAllLbl:'Select page',
  btnReload:'↻ Reload',btnCsv:'⬇ Export CSV',btnMaintain:'🧹 Run Auto-Delist',btnClear:'Clear',btnBatch:'🚀 Batch Import',btnReset:'Reset',btnSave:'💾 Save All',
  chDailyT:'Revenue vs Profit — Daily (30d)',chViewsT:'Page Views Trend (30d)',chWeekT:'Weekly Revenue (8 wks)',chMonthT:'Monthly Revenue (6 mo)',pnlT:'P&L — Last 7 Days',perfT:'Product Performance (Views → Sales → Conversion)',
  scanning:'Scanning... (9 categories · ~40s)',needKey:'Enter the access key first',loadMore:'Load more (page ',page:')',selCountA:'',selCountB:' selected',
  kRev:'Revenue (30d)',kProfit:'Gross Profit (30d)',kOrders:'Orders / Avg Order (30d)',kViews:'Views / Conversion (30d)',
  colDate:'Date',colRev:'Revenue',colCost:'COGS',colFee:'Fees (est)',colProfit:'Profit',colOrders:'Orders',
  colProduct:'Product',colViews:'Views',colQty:'Sold',colConv:'Conv.',margin:'margin',sold:'sold',pcs:'',linkCJ:'View on CJ ↗',linkStore:'Store page ↗',shipLbl:'ship',inclShip:' (incl. ship)',mSelAllLbl:'Select all',btnDelistSel:'🗑 Delist selected',noneSelected:'Nothing selected',markedDelist:'Marked ',markedDelist2:' item(s) for removal — press Save to apply',
  catHome:'🏠 Home',catBeauty:'💄 Beauty',catTech:'⚡ Tech',catPets:'🐾 Pets',catBaby:'🧸 Baby & Kids',catSports:'⛺ Sports',catAccessories:'💍 Accessories',catBags:'👜 Bags & Shoes',catAuto:'🚗 Auto'}
};
function dt(k){ return (DI[DLANG]&&DI[DLANG][k])||DI.zh[k]||k; }
function applyTheme(){
  document.documentElement.setAttribute('data-theme', DTHEME);
  document.getElementById('themeBtn').textContent = DTHEME==='dark'?'☀️':'🌙';
}
function toggleTheme(){ DTHEME = DTHEME==='dark'?'light':'dark'; try{localStorage.setItem('dash-theme',DTHEME);}catch(e){} applyTheme(); }
function applyDashLang(){
  document.querySelectorAll('[data-dt]').forEach(el=>{ el.textContent = dt(el.dataset.dt); });
  document.getElementById('langBtn').textContent = DLANG==='zh'?'EN':'中';
  renderCatTabs();
  if(winnersData) renderGrid();
  if(typeof working!=='undefined' && working.length) renderList();
}
function toggleDashLang(){ DLANG = DLANG==='zh'?'en':'zh'; try{localStorage.setItem('dash-lang',DLANG);}catch(e){} applyDashLang(); }

const CATS = ['home','beauty','tech','pets','baby','sports','accessories','bags','auto'].map(k=>({key:k, get label(){ return dt('cat'+k.charAt(0).toUpperCase()+k.slice(1)); }}));
let winnersData = Object.fromEntries(CATS.map(c=>[c.key,[]]));
function renderCatTabs(){
  document.getElementById('catTabBtns').innerHTML = CATS.map(c=>
    `<button class="cat-tab ${c.key===currentCat?'on':''}" data-cat="${c.key}" onclick="switchCat('${c.key}',this)">${c.label} <span id="cnt-${c.key}"></span></button>`
  ).join('');
}
let currentCat = 'home';
let currentPage = 1;
let selected = new Set();   // "cat|pid"
let original = [], working = [];
let manageLoaded = false;

/* ---------- utils ---------- */
function prettyPrice(raw){ const r = Math.ceil(raw/10)*10-2; return Math.max(r,48); }
function parseCost(v){ if(v==null)return null; const m=String(v).match(/[\d.]+/g); return m?parseFloat(m[0]):null; }
function secretVal(){ return document.getElementById('secret').value.trim(); }
function setStatus(msg,type){ const el=document.getElementById('topStatus'); el.textContent=msg; el.className='status '+(type||''); }
let toastTimer;
function toast(msg,type){ const el=document.getElementById('toast'); el.textContent=msg; el.className='toast show '+(type||''); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.className='toast',3400); }

/* ---------- mode switch ---------- */
function switchMode(m){
  document.querySelectorAll('.mode-tab').forEach(t=>t.classList.remove('on'));
  document.getElementById('mt-'+m).classList.add('on');
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  document.getElementById('view-'+m).classList.add('on');
  document.getElementById('batchBar').classList.toggle('show', m==='discover' && selected.size>0);
  updateSaveBar();
  if(m==='manage' && !manageLoaded && secretVal()) loadProducts();
  if(m==='sales' && secretVal()) loadSales();
}

/* ---------- discover ---------- */
async function loadWinners(page){
  if(!secretVal()){ setStatus(dt('needKey'),'err'); return; }
  currentPage = page || 1;
  const btn = document.getElementById('scanBtn');
  btn.disabled = true; btn.textContent = dt('scanning');
  document.getElementById('catTabs').classList.add('show');
  if(currentPage === 1){
    selected.clear(); updateBatchBar();
    document.getElementById('grid').innerHTML = Array.from({length:8}).map(()=>'<div class="skel"></div>').join('');
  }
  try{
    const res = await fetch(`/api/admin/trending-picks?secret=${encodeURIComponent(secretVal())}&page=${currentPage}`);
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    if(currentPage === 1){
      winnersData = data.results;
    }else{
      CATS.forEach(cc=>{
        const c = cc.key;
        const existing = new Set((winnersData[c]||[]).map(p=>p.cjPid));
        (data.results[c]||[]).forEach(p=>{ if(!existing.has(p.cjPid)) winnersData[c].push(p); });
      });
    }
    setStatus('','');
    document.getElementById('topStatus').className='status';
    const strip = document.getElementById('statStrip');
    strip.innerHTML = CATS.map(cc=>
      `<span class="schip">${cc.key.toUpperCase()} <b>${(winnersData[cc.key]||[]).length}</b></span>`
    ).join('') + `<span class="schip">PAGE <b>${currentPage}</b></span>`;
    strip.classList.add('show');
    renderCatTabs();
    CATS.forEach(cc=>{ const el=document.getElementById('cnt-'+cc.key); if(el) el.textContent='('+(winnersData[cc.key]||[]).length+')'; });
    renderGrid();
    document.getElementById('loadmoreRow').style.display='block';
    document.getElementById('nextPageNum').textContent = currentPage+1;
    document.getElementById('moreBtnLbl').textContent = dt('loadMore');
    document.getElementById('moreBtnLbl2').textContent = dt('page');
    toast(`掃描完成 · 累計 ${CATS.reduce((s,cc)=>s+(winnersData[cc.key]||[]).length,0)} 款`,'ok');
  }catch(e){
    setStatus('掃描失敗:'+e.message,'err');
    if(currentPage===1) document.getElementById('grid').innerHTML='';
  }finally{
    btn.disabled=false; btn.textContent=dt('btnScan');
  }
}

function switchCat(cat, el){
  currentCat = cat;
  document.querySelectorAll('.cat-tab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');
  document.getElementById('selAll').checked = false;
  renderGrid();
}

function renderGrid(){
  const grid = document.getElementById('grid');
  const markup = parseFloat(document.getElementById('markup').value)||2.8;
  const items = winnersData[currentCat]||[];
  if(items.length===0){ grid.innerHTML='<p class="empty">// NO DATA — 撳「掃描贏家產品」開始</p>'; return; }
  grid.innerHTML = items.map((p,i)=>{
    const cost = parseCost(p.cjCostUSD);
    const shipEst = parseFloat(document.getElementById('shipEst').value) || 0;
    const sell = cost ? prettyPrice(cost*USD_TO_HKD*markup + shipEst*USD_TO_HKD) : null;
    const margin = (cost&&sell) ? Math.round(sell-(cost+shipEst)*USD_TO_HKD) : null;
    const key = currentCat+'|'+p.cjPid;
    return `
    <div class="pcard ${selected.has(key)?'selected':''}" id="card-${i}">
      <div class="imgbox" onclick="toggleSelect('${key}',${i})">
        ${(p.listedNum||0)>3000?'<span class="hot-tag">🔥 HOT</span>':''}
        <span class="sel-check">✓</span>
        <img src="${p.image||''}" loading="lazy" onerror="this.style.display='none'">
      </div>
      <div class="pi">
        <div class="pname">${p.nameEn||''}</div>
        <div class="meta" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">LISTED ${(p.listedNum||0).toLocaleString()} · $${cost!=null?cost:'?'}+$${shipEst} ${dt('shipLbl')} <a class="qlink" href="https://www.cjdropshipping.com/product/-p-${p.cjPid}.html" target="_blank" rel="noopener" onclick="event.stopPropagation()">CJ ↗</a></div>
        <div class="prices"><span class="lbl">賣價</span><span class="sell">HK$${sell||'—'}</span></div>
        ${margin!=null?`<div class="margin-tag">+HK$${margin} ${dt('margin')}</div>`:''}
      </div>
    </div>`;
  }).join('');
}

document.getElementById('markup').addEventListener('input',()=>{ renderGrid(); });
document.getElementById('shipEst').addEventListener('input',()=>{ if(winnersData) renderGrid(); });

/* ---------- selection & batch ---------- */
function toggleSelect(key, idx){
  if(selected.has(key)) selected.delete(key); else selected.add(key);
  document.getElementById('card-'+idx).classList.toggle('selected', selected.has(key));
  updateBatchBar();
}
function toggleSelectAll(checked){
  (winnersData[currentCat]||[]).forEach(p=>{
    const key = currentCat+'|'+p.cjPid;
    if(checked) selected.add(key); else selected.delete(key);
  });
  renderGrid(); updateBatchBar();
}
function clearSelection(){ selected.clear(); document.getElementById('selAll').checked=false; renderGrid(); updateBatchBar(); }
function updateBatchBar(){
  document.getElementById('selCountWrap').innerHTML = dt('selCountA')+'<b id="selCount">'+selected.size+'</b>'+dt('selCountB');
  document.getElementById('batchBar').classList.toggle('show', selected.size>0 && document.getElementById('view-discover').classList.contains('on'));
}

async function batchImport(){
  if(selected.size===0) return;
  const markup = parseFloat(document.getElementById('markup').value)||2.8;
  const items = [...selected].map(k=>{ const [cat,pid]=k.split('|'); return {pid,cat}; });
  const btn = document.getElementById('batchBtn');
  btn.disabled = true;
  let done=0, ok=0, skip=0, fail=0;
  // 每batch最多8件(每件~1.2秒,留返buffer畀60秒上限)
  for(let i=0;i<items.length;i+=8){
    const chunk = items.slice(i,i+8);
    btn.textContent = `上架緊 ${done}/${items.length}...`;
    try{
      const res = await fetch('/api/admin/auto-import',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({secret:secretVal(), markup, shipEstUSD: parseFloat(document.getElementById('shipEst').value)||5, items:chunk})
      });
      const data = await res.json();
      if(data.error && !data.report) throw new Error(data.error);
      const r = data.report||{};
      ok += (r.imported||[]).length; skip += (r.skipped||[]).length; fail += (r.errors||[]).length;
    }catch(e){ fail += chunk.length; }
    done += chunk.length;
  }
  btn.disabled=false; btn.textContent='🚀 批量上架';
  setStatus(`批量完成 → 上架 ${ok} 件 · 跳過 ${skip} 件(重複) · 失敗 ${fail} 件\n約1分鐘後全部live。`, fail>0?'err':'ok');
  toast(`✓ 批量上架 ${ok} 件`, 'ok');
  clearSelection();
  manageLoaded = false; // 下次入管理tab自動重新load
}

/* ---------- price sync ---------- */
async function syncPrices(){
  if(!secretVal()){ setStatus(dt('needKey'),'err'); return; }
  const btn=document.getElementById('syncBtn');
  btn.disabled=true; btn.textContent='同步緊...';
  try{
    const res = await fetch(`/api/cron/price-sync?secret=${encodeURIComponent(secretVal())}`);
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    const r = data.report||{};
    if((r.updated||[]).length>0){
      setStatus('✓ '+data.message+'\n'+r.updated.map(u=>`#${u.id} ${u.name}: HK$${u.priceHKD}`).join('\n'),'ok');
      manageLoaded=false;
    }else{
      setStatus(`✓ ${data.message}(檢查咗${r.checked||0}件)`,'ok');
    }
    toast('價格同步完成','ok');
  }catch(e){ setStatus('同步失敗:'+e.message,'err'); toast('同步失敗','err'); }
  finally{ btn.disabled=false; btn.textContent='🔄 同步CJ價格'; }
}

/* ---------- manage ---------- */
async function loadProducts(){
  if(!secretVal()){ setStatus(dt('needKey'),'err'); return; }
  document.getElementById('plist').innerHTML='<div class="skel" style="height:70px;margin:12px 0"></div>'.repeat(3);
  try{
    const res = await fetch(`/api/admin/manage-products?secret=${encodeURIComponent(secretVal())}`);
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    original = data.products||[];
    working = JSON.parse(JSON.stringify(original)).map(p=>({...p,_deleted:false}));
    manageLoaded = true;
    mSel.clear();
    renderList();
  }catch(e){
    document.getElementById('plist').innerHTML=`<p class="empty">載入失敗:${e.message}</p>`;
  }
}

function renderList(){
  const box=document.getElementById('plist');
  if(working.length===0){ box.innerHTML='<p class="empty">// 未有經Dashboard上架嘅產品</p>'; updateSaveBar(); return; }
  box.innerHTML = working.map((p,i)=>{
    const name=(p.i18n&&p.i18n['zh-Hant']&&p.i18n['zh-Hant'].name)||'';
    const costHKD = p.costUSD?Math.round((p.costUSD+(p.shipUSD||0))*USD_TO_HKD):null;
    const margin = costHKD!=null?p.price-costHKD:null;
    return `
    <div class="prow ${p._deleted?'deleted':''}">
      <input type="checkbox" class="mchk" ${mSel.has(p.id)?'checked':''} ${p._deleted?'disabled':''} onchange="mToggleRow(${p.id},this.checked)">
      <img src="${p.image||''}" loading="lazy" onerror="this.style.visibility='hidden'">
      <div>
        <input class="name-in" value="${name.replace(/"/g,'&quot;')}" oninput="editName(${i},this.value)" ${p._deleted?'disabled':''}>
        <div class="rmeta">#${p.id} · ${p.catClass.toUpperCase()} · COST ${costHKD!=null?('HK$'+costHKD+(p.shipUSD?dt('inclShip'):'')):'?'} · ${dt('sold')} ${p.soldQty||0}${dt('pcs')?' '+dt('pcs'):''} · ${(p.addedAt||'').slice(0,10)}</div>
        <div class="rlinks">
          <a class="qlink" href="https://www.cjdropshipping.com/product/-p-${p.cjPid}.html" target="_blank" rel="noopener">${dt('linkCJ')}</a>
          <a class="qlink" href="/?p=${p.id}" target="_blank" rel="noopener">${dt('linkStore')}</a>
        </div>
        ${p.delisted?'<span class="delist-badge">⚠ 自動落架中(前台隱藏)</span>':''}
      </div>
      <div>
        <input type="number" class="price-in ${isPriceChanged(i)?'changed':''}" value="${p.price}" min="1" oninput="editPrice(${i},this)" ${p._deleted?'disabled':''}>
        <div class="rmargin ${margin!=null&&margin<0?'neg':''}" id="rm-${i}">${margin!=null?(dt('margin')+' HK$'+margin):''}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${p.delisted?`<button class="del-btn" style="color:var(--ok);border-color:rgba(61,220,132,.4)" onclick="relist(${i})">上返架</button>`:''}
        <button class="del-btn" onclick="toggleDelete(${i})">${p._deleted?'還原':'永久刪除'}</button>
      </div>
    </div>`;
  }).join('');
  updateSaveBar();
  mSyncUI();
}
function isPriceChanged(i){ return original[i] && working[i].price!==original[i].price; }
function editName(i,v){ if(!working[i].i18n)working[i].i18n={'zh-Hant':{},'zh-Hans':{},'en':{}}; working[i].i18n['zh-Hant'].name=v; updateSaveBar(); }
function editPrice(i,el){
  working[i].price=parseInt(el.value)||0;
  el.classList.toggle('changed',isPriceChanged(i));
  const costHKD=working[i].costUSD?Math.round((working[i].costUSD+(working[i].shipUSD||0))*USD_TO_HKD):null;
  const rm=document.getElementById('rm-'+i);
  if(costHKD!=null&&rm){ const m=working[i].price-costHKD; rm.textContent=dt('margin')+' HK$'+m; rm.classList.toggle('neg',m<0); }
  updateSaveBar();
}
let mSel = new Set();
function mToggleRow(id, checked){ if(checked) mSel.add(id); else mSel.delete(id); mSyncUI(); }
function mToggleAll(checked){
  mSel.clear();
  if(checked) working.forEach(p=>{ if(!p._deleted) mSel.add(p.id); });
  renderList();
}
function mSyncUI(){
  const btn=document.getElementById('btnDelistSel');
  if(btn) btn.textContent = dt('btnDelistSel') + (mSel.size?` (${mSel.size})`:'');
  const all=document.getElementById('mSelAll');
  const selectable=working.filter(p=>!p._deleted).length;
  if(all) all.checked = selectable>0 && mSel.size>=selectable;
}
function delistSelected(){
  if(mSel.size===0){ toast(dt('noneSelected'),'err'); return; }
  working.forEach(p=>{ if(mSel.has(p.id)) p._deleted=true; });
  const cnt=mSel.size; mSel.clear();
  renderList();
  toast(dt('markedDelist')+cnt+dt('markedDelist2'));
}
function toggleDelete(i){ working[i]._deleted=!working[i]._deleted; mSel.delete(working[i].id); renderList(); }
function relist(i){ working[i].delisted=false; renderList(); toast('已標記上返架,記得撳「儲存」先生效'); }
function exportCSV(){
  const src = original.length ? original : working;
  if(!src.length){ toast('未有產品可匯出','err'); return; }
  const rows = [['ID','名稱','類別','售價HKD','成本USD','毛利HKD','累計銷量','狀態','CJ_PID','CJ_VID','上架日期']];
  src.forEach(p=>{
    const name=(p.i18n&&p.i18n['zh-Hant']&&p.i18n['zh-Hant'].name)||'';
    const costHKD=p.costUSD?Math.round((p.costUSD+(p.shipUSD||0))*USD_TO_HKD):'';
    rows.push([p.id,name,p.catClass,p.price,p.costUSD||'',costHKD!==''?p.price-costHKD:'',p.soldQty||0,p.delisted?'已落架':'上架中',p.cjPid,p.cjVid,(p.addedAt||'').slice(0,10)]);
  });
  const csv='\ufeff'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='picked-right-it-products-'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('CSV已下載','ok');
}
async function runMaintain(){
  if(!secretVal()){ setStatus(dt('needKey'),'err'); return; }
  toast('執行緊自動落架檢查...');
  try{
    const res=await fetch(`/api/cron/store-maintain?secret=${encodeURIComponent(secretVal())}`);
    const data=await res.json();
    if(data.error) throw new Error(data.error);
    toast('✓ '+data.message,'ok');
    manageLoaded=false; loadProducts();
  }catch(e){ toast('失敗:'+e.message,'err'); }
}
let charts = {};
function mkChart(id, cfg){
  if(charts[id]) charts[id].destroy();
  const ctx = document.getElementById(id);
  if(!ctx || typeof Chart==='undefined') return;
  Chart.defaults.color = '#9a92a8';
  Chart.defaults.borderColor = 'rgba(255,255,255,.08)';
  Chart.defaults.font.family = "'JetBrains Mono','Noto Sans TC',monospace";
  Chart.defaults.font.size = 10;
  charts[id] = new Chart(ctx, cfg);
}
async function loadSales(){
  if(!secretVal()){ setStatus(dt('needKey'),'err'); return; }
  document.getElementById('kpiRow').innerHTML='';
  document.getElementById('prodPerf').innerHTML='<div class="skel" style="height:60px;margin:10px 0"></div>'.repeat(3);
  try{
    const res=await fetch(`/api/admin/analytics?secret=${encodeURIComponent(secretVal())}`);
    const data=await res.json();
    if(data.error) throw new Error(data.error);
    const s=data.summary;

    // KPIs
    document.getElementById('kpiRow').innerHTML=`
      <div class="kpi"><div class="kl">${dt('kRev')}</div><div class="kv">HK$${s.revenue30HKD.toLocaleString()}</div></div>
      <div class="kpi"><div class="kl">${dt('kProfit')}</div><div class="kv" style="color:${s.profit30HKD>=0?'var(--ok)':'var(--err)'}">HK$${s.profit30HKD.toLocaleString()}</div></div>
      <div class="kpi"><div class="kl">${dt('kOrders')}</div><div class="kv">${s.orders30} <span style="font-size:.85rem">· HK$${s.avgOrderHKD}</span></div></div>
      <div class="kpi"><div class="kl">${dt('kViews')}</div><div class="kv">${s.views30.toLocaleString()} <span style="font-size:.85rem">· ${s.convRate30!=null?s.convRate30+'%':'—'}</span></div></div>`;

    const labels = data.daily.map(d=>d.label);
    // 每日營業額vs毛利
    mkChart('chDaily',{type:'line',data:{labels,datasets:[
      {label:'營業額',data:data.daily.map(d=>d.revenue),borderColor:'#3de0ff',backgroundColor:'rgba(61,224,255,.12)',fill:true,tension:.35,pointRadius:0,borderWidth:2},
      {label:'毛利',data:data.daily.map(d=>d.profit),borderColor:'#ff3d7a',backgroundColor:'rgba(255,61,122,.1)',fill:true,tension:.35,pointRadius:0,borderWidth:2}
    ]},options:{responsive:true,plugins:{legend:{labels:{boxWidth:10}}},scales:{y:{grid:{color:'rgba(255,255,255,.05)'}},x:{ticks:{maxTicksLimit:8}}}}});
    // 瀏覽量
    mkChart('chViews',{type:'line',data:{labels,datasets:[
      {label:'瀏覽量',data:data.daily.map(d=>d.views),borderColor:'#8b5cf6',backgroundColor:'rgba(139,92,246,.15)',fill:true,tension:.35,pointRadius:0,borderWidth:2}
    ]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{grid:{color:'rgba(255,255,255,.05)'}},x:{ticks:{maxTicksLimit:8}}}}});
    // 週
    mkChart('chWeek',{type:'bar',data:{labels:data.weekly.map(w=>w.label),datasets:[
      {label:'營業額',data:data.weekly.map(w=>w.revenue),backgroundColor:'rgba(61,224,255,.55)',borderRadius:6}
    ]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{grid:{color:'rgba(255,255,255,.05)'}}}}});
    // 月
    mkChart('chMonth',{type:'bar',data:{labels:data.monthly.map(m=>m.label),datasets:[
      {label:'營業額',data:data.monthly.map(m=>m.revenue),backgroundColor:'rgba(255,61,122,.55)',borderRadius:6}
    ]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{grid:{color:'rgba(255,255,255,.05)'}}}}});

    // 近7日P&L
    const last7 = data.daily.slice(-7).reverse();
    document.getElementById('pnlTable').innerHTML =
      `<div class="pnl-row head"><span>${dt('colDate')}</span><span>${dt('colRev')}</span><span>${dt('colCost')}</span><span>${dt('colFee')}</span><span>${dt('colProfit')}</span><span>${dt('colOrders')}</span></div>` +
      last7.map(d=>`<div class="pnl-row"><span>${d.label}</span><span>HK$${d.revenue}</span><span>HK$${d.cost}</span><span>HK$${d.stripeFee}</span><span class="${d.profit>=0?'pnl-pos':'pnl-neg'}">HK$${d.profit}</span><span>${d.orders}</span></div>`).join('');

    // 產品表現
    if((data.products||[]).length){
      document.getElementById('prodPerf').innerHTML =
        `<div class="perf-row head"><span>${dt('colProduct')}</span><span class="num">${dt('colViews')}</span><span class="num">${dt('colQty')}</span><span class="num hide-m">${dt('colRev')}</span><span class="num hide-m">${dt('colConv')}</span></div>` +
        data.products.map(x=>{
          const conv = x.convRate!=null ? x.convRate : null;
          return `<div class="perf-row">
            <span>${x.name}${x.delisted?' <span class="delist-badge">已落架</span>':''}</span>
            <span class="num">${x.views.toLocaleString()}</span>
            <span class="num">${x.qty}</span>
            <span class="num hide-m">HK$${x.revenue.toLocaleString()}</span>
            <span class="num hide-m ${conv!=null?(conv>=2?'conv-hi':'conv-lo'):''}">${conv!=null?conv+'%':'—'}</span>
          </div>`;
        }).join('');
    }else{
      document.getElementById('prodPerf').innerHTML='<p class="empty">// 未有數據 — 有人瀏覽/落單之後就會出現</p>';
    }
    toast('數據已更新','ok');
  }catch(e){
    document.getElementById('prodPerf').innerHTML=`<p class="empty">${e.message}</p>`;
    document.getElementById('pnlTable').innerHTML='';
  }
}
function countChanges(){
  let price=0,name=0,del=0,relist=0;
  working.forEach((p,i)=>{ const o=original[i]; if(!o)return;
    if(p._deleted){del++;return;}
    if(p.price!==o.price)price++;
    if(!!p.delisted !== !!o.delisted)relist++;
    const n1=(p.i18n&&p.i18n['zh-Hant']&&p.i18n['zh-Hant'].name)||'', n2=(o.i18n&&o.i18n['zh-Hant']&&o.i18n['zh-Hant'].name)||'';
    if(n1!==n2)name++;
  });
  return {price,name,del,relist,total:price+name+del+relist};
}
function updateSaveBar(){
  const c=countChanges();
  const inManage = document.getElementById('view-manage').classList.contains('on');
  const bar=document.getElementById('saveBar');
  if(c.total===0||!inManage){ bar.classList.remove('show'); return; }
  const parts=[]; if(c.price)parts.push(`改價${c.price}`); if(c.name)parts.push(`改名${c.name}`); if(c.del)parts.push(`刪除${c.del}`); if(c.relist)parts.push(`上返架${c.relist}`);
  document.getElementById('changesSummary').innerHTML=`未儲存:<b>${parts.join(' · ')}</b>`;
  bar.classList.add('show');
}
function resetChanges(){ working=JSON.parse(JSON.stringify(original)).map(p=>({...p,_deleted:false})); renderList(); toast('已還原'); }
async function saveAll(){
  const c=countChanges();
  if(c.del>0 && !confirm(`確定落架 ${c.del} 件?落架後客人買唔到。`)) return;
  const btn=document.getElementById('saveBtn');
  btn.disabled=true; btn.textContent='儲存緊...';
  try{
    const finalList = working.filter(p=>!p._deleted).map(({_deleted,...p})=>p);
    const res=await fetch('/api/admin/manage-products',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({secret:secretVal(),products:finalList})});
    const data=await res.json();
    if(data.error) throw new Error(data.error);
    original=JSON.parse(JSON.stringify(finalList));
    working=finalList.map(p=>({...p,_deleted:false}));
    renderList();
    toast(`✓ 已儲存 ${data.count} 件,約1分鐘後生效`,'ok');
  }catch(e){ toast('儲存失敗:'+e.message,'err'); }
  finally{ btn.disabled=false; btn.textContent='💾 一次過儲存'; }
}

applyTheme();
applyDashLang();

/* manage tab載入trigger */
document.getElementById('mt-manage').addEventListener('click',()=>{ if(!manageLoaded && secretVal()) loadProducts(); });
</script>
