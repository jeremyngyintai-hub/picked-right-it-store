<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>揀啱 · 贏家產品管理台</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f2eef4; --card:#fbf9fb; --ink:#1f1726; --ink-soft:#726a78;
    --accent-a:#ff3d7a; --accent-b:#5b3df5;
    --accent-grad:linear-gradient(135deg,var(--accent-a),var(--accent-b));
    --line:#ddd5df; --ok:#2e9e5b; --ok-bg:#e5f4ea; --err:#b3372f; --err-bg:#fbe9e9;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans TC','Inter',sans-serif;line-height:1.6;}
  a{color:inherit;text-decoration:none;}

  /* top bar */
  .topbar{position:sticky;top:0;z-index:20;background:rgba(242,238,244,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);}
  .topbar-inner{max-width:1140px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:12px;}
  .brand-mark{width:36px;height:36px;position:relative;flex:none;color:var(--accent-a);}
  .brand-mark svg{position:absolute;inset:0;width:100%;height:100%;}
  .brand-mark span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif TC',serif;font-weight:600;font-size:1rem;color:var(--ink);}
  .brand-text b{font-family:'Noto Serif TC',serif;font-size:1.05rem;font-weight:600;display:block;line-height:1.15;}
  .brand-text em{font-style:normal;font-family:'Inter',sans-serif;font-size:.58rem;letter-spacing:.22em;color:var(--ink-soft);}
  .topbar .spacer{flex:1;}
  .site-link{font-size:.8rem;color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;padding:8px 16px;transition:all .15s;}
  .site-link:hover{color:var(--ink);border-color:var(--ink);}

  .wrap{max-width:1140px;margin:0 auto;padding:28px 20px 90px;}
  h1{font-family:'Noto Serif TC',serif;font-size:1.5rem;margin:0 0 4px;font-weight:600;}
  .sub{color:var(--ink-soft);font-size:.86rem;margin-bottom:24px;}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:22px;box-shadow:0 2px 12px -6px rgba(31,23,38,.06);}
  label{display:block;font-size:.74rem;font-weight:700;color:var(--ink-soft);margin-bottom:7px;letter-spacing:.04em;}
  input,select{width:100%;padding:12px 15px;border:1px solid var(--line);border-radius:12px;font-family:inherit;font-size:.9rem;background:#fff;transition:border-color .15s;}
  input:focus{outline:none;border-color:var(--accent-a);}
  .row{display:grid;grid-template-columns:1.2fr 1fr auto;gap:14px;align-items:end;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 26px;border:none;border-radius:999px;background:var(--accent-grad);color:#fff;font-family:inherit;font-size:.88rem;font-weight:600;cursor:pointer;transition:filter .15s, transform .1s;box-shadow:0 8px 20px -8px rgba(255,61,122,.5);}
  .btn:hover{filter:brightness(.95);}
  .btn:active{transform:scale(.97);}
  .btn:disabled{opacity:.55;cursor:not-allowed;box-shadow:none;}
  .btn-sm{padding:10px 18px;font-size:.8rem;width:100%;}

  .note{font-size:.75rem;color:var(--ink-soft);margin:12px 0 0;}
  .status{margin-top:14px;font-size:.85rem;padding:12px 16px;border-radius:12px;display:none;}
  .status.ok{display:block;background:var(--ok-bg);color:var(--ok);}
  .status.err{display:block;background:var(--err-bg);color:var(--err);}

  /* stat chips */
  .stat-chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;display:none;}
  .stat-chips.show{display:flex;}
  .chip{font-size:.76rem;font-family:'Inter','Noto Sans TC',sans-serif;font-weight:600;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;color:var(--ink-soft);}
  .chip b{color:var(--ink);}

  /* category tabs */
  .cat-tabs{display:none;gap:8px;margin:6px 0 16px;flex-wrap:wrap;}
  .cat-tabs.show{display:flex;}
  .cat-tab{padding:9px 20px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-family:inherit;font-size:.84rem;font-weight:500;cursor:pointer;color:var(--ink-soft);transition:all .15s;}
  .cat-tab:hover{border-color:var(--ink);color:var(--ink);}
  .cat-tab.on{background:var(--accent-grad);color:#fff;border-color:transparent;box-shadow:0 6px 16px -6px rgba(255,61,122,.5);}

  /* product cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:18px;}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;}
  .pcard:hover{transform:translateY(-3px);box-shadow:0 18px 30px -14px rgba(31,23,38,.28);border-color:var(--accent-a);}
  .pcard .imgbox{aspect-ratio:1;overflow:hidden;background:#efeaf1;position:relative;}
  .pcard img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease;}
  .pcard:hover img{transform:scale(1.05);}
  .hot-tag{position:absolute;top:10px;left:10px;background:var(--accent-grad);color:#fff;font-size:.62rem;font-weight:700;letter-spacing:.05em;padding:4px 10px;border-radius:999px;font-family:'Inter',sans-serif;}
  .pcard .pi{padding:13px 15px 15px;display:flex;flex-direction:column;gap:7px;flex:1;}
  .pcard .pname{font-size:.8rem;line-height:1.45;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.3em;}
  .pcard .meta{font-size:.7rem;color:var(--ink-soft);font-family:'Inter','Noto Sans TC',sans-serif;}
  .pcard .prices{display:flex;justify-content:space-between;align-items:baseline;font-family:'Inter',sans-serif;}
  .pcard .prices .lbl{font-size:.74rem;color:var(--ink-soft);}
  .pcard .sell{font-weight:800;font-size:1.05rem;background:var(--accent-grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .margin-tag{font-size:.7rem;color:var(--ok);font-weight:600;}

  /* skeleton loading */
  .skel{background:linear-gradient(90deg,#e9e3ec 25%,#f4f0f6 50%,#e9e3ec 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:16px;}
  @keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
  .skel-card{height:340px;}

  /* toast */
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:13px 22px;border-radius:999px;font-size:.84rem;opacity:0;pointer-events:none;transition:all .3s ease;z-index:50;box-shadow:0 12px 30px rgba(0,0,0,.25);max-width:90vw;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.ok{background:var(--ok);}
  .toast.err{background:var(--err);}

  .empty{color:var(--ink-soft);font-size:.88rem;padding:40px 0;text-align:center;}
  @media(max-width:760px){.row{grid-template-columns:1fr;}.btn{width:100%;}}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <span class="brand-mark">
      <svg viewBox="0 0 100 100"><path d="M50,8 C22,6 6,28 8,50 C10,74 28,92 52,90 C76,92 94,70 92,46 C90,20 74,6 50,8 Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>
      <span>揀</span>
    </span>
    <span class="brand-text"><b>揀啱管理台</b><em>WINNER&nbsp;PICKER</em></span>
    <span class="spacer"></span>
    <a class="site-link" href="/manage.html">📦 產品管理</a>
    <a class="site-link" href="/" target="_blank">開啟商店 ↗</a>
  </div>
</div>

<div class="wrap">
  <h1>贏家產品管理台</h1>
  <p class="sub">搵CJ熱賣產品 → 設定利潤倍數 → 一撳上架,約1分鐘後自動live喺商店。</p>

  <div class="panel">
    <div class="row">
      <div>
        <label>管理密碼</label>
        <input type="password" id="secret" placeholder="ADMIN_SYNC_SECRET" autocomplete="off">
      </div>
      <div>
        <label>利潤倍數(售價 = 成本 × 倍數)</label>
        <input type="number" id="markup" value="2.8" step="0.1" min="1.2">
      </div>
      <div>
        <button class="btn" id="loadBtn" onclick="loadWinners()">🔍 搵贏家產品</button>
      </div>
    </div>
    <p class="note">倍數參考:2.5–3.0 係 dropshipping 常見水平(要 cover 廣告、運費同 Stripe 手續費先有淨利)。改倍數,下面售價即時重新計算。</p>
    <div class="status" id="topStatus"></div>
    <div class="stat-chips" id="statChips"></div>
  </div>

  <div class="cat-tabs" id="catTabs">
    <button class="cat-tab on" data-cat="home" onclick="switchCat('home',this)">🏠 家居</button>
    <button class="cat-tab" data-cat="beauty" onclick="switchCat('beauty',this)">💄 美妝</button>
    <button class="cat-tab" data-cat="tech" onclick="switchCat('tech',this)">⚡ 電子</button>
  </div>

  <div class="grid" id="grid"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const USD_TO_HKD = 7.8;
let winnersData = null;
let currentCat = 'home';

function prettyPrice(raw){
  const rounded = Math.ceil(raw/10)*10 - 2;
  return Math.max(rounded, 48);
}
function parseCost(v){
  if(v==null) return null;
  const m = String(v).match(/[\d.]+/g);
  return m ? parseFloat(m[0]) : null;
}
function setStatus(el, msg, type){
  el.textContent = msg;
  el.className = 'status ' + type;
}
let toastTimer;
function toast(msg, type){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + (type||'');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.className = 'toast'; }, 3200);
}
function showSkeletons(){
  document.getElementById('grid').innerHTML =
    Array.from({length:5}).map(()=>'<div class="skel skel-card"></div>').join('');
}

async function loadWinners(){
  const secret = document.getElementById('secret').value.trim();
  const st = document.getElementById('topStatus');
  if(!secret){ setStatus(st,'請先輸入管理密碼','err'); return; }
  const btn = document.getElementById('loadBtn');
  btn.disabled = true; btn.textContent = '搵緊...(約15秒)';
  document.getElementById('catTabs').classList.add('show');
  showSkeletons();
  try{
    const res = await fetch(`/api/admin/trending-picks?secret=${encodeURIComponent(secret)}`);
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    winnersData = data.results;
    st.className = 'status';
    const chips = document.getElementById('statChips');
    chips.innerHTML = `
      <span class="chip">🏠 家居 <b>${(data.results.home||[]).length}</b> 款</span>
      <span class="chip">💄 美妝 <b>${(data.results.beauty||[]).length}</b> 款</span>
      <span class="chip">⚡ 電子 <b>${(data.results.tech||[]).length}</b> 款</span>`;
    chips.classList.add('show');
    renderGrid();
    toast('搵貨完成 ✓','ok');
  }catch(e){
    setStatus(st, '搵貨失敗:' + e.message, 'err');
    document.getElementById('grid').innerHTML = '';
  }finally{
    btn.disabled = false; btn.textContent = '🔍 搵贏家產品';
  }
}

function switchCat(cat, el){
  currentCat = cat;
  document.querySelectorAll('.cat-tab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');
  renderGrid();
}

function renderGrid(){
  const grid = document.getElementById('grid');
  const markup = parseFloat(document.getElementById('markup').value) || 2.8;
  const items = (winnersData && winnersData[currentCat]) || [];
  if(items.length === 0){ grid.innerHTML = '<p class="empty">呢個類別暫時冇結果,可以撳「搵贏家產品」重新搵。</p>'; return; }
  grid.innerHTML = items.map((p,i)=>{
    const cost = parseCost(p.cjCostUSD);
    const sell = cost ? prettyPrice(cost * USD_TO_HKD * markup) : null;
    const marginHKD = (cost && sell) ? Math.round(sell - cost*USD_TO_HKD) : null;
    return `
    <div class="pcard">
      <div class="imgbox">
        ${(p.listedNum||0) > 3000 ? '<span class="hot-tag">🔥 HOT</span>' : ''}
        <img src="${p.image||''}" alt="" loading="lazy" onerror="this.style.display='none'">
      </div>
      <div class="pi">
        <div class="pname">${p.nameEn||''}</div>
        <div class="meta">上架數 ${(p.listedNum||0).toLocaleString()} · 成本 US$${cost!=null?cost:'?'}</div>
        <div class="prices"><span class="lbl">賣價</span><span class="sell">${sell?('HK$'+sell):'—'}</span></div>
        ${marginHKD!=null?`<div class="margin-tag">毛利約 HK$${marginHKD}/件(未計運費廣告)</div>`:''}
        <button class="btn btn-sm" onclick="importProduct(${i}, this)">一撳上架</button>
        <div class="status" id="st-${currentCat}-${i}"></div>
      </div>
    </div>`;
  }).join('');
}

document.getElementById('markup').addEventListener('input', ()=>{ if(winnersData) renderGrid(); });

async function importProduct(index, btn){
  const secret = document.getElementById('secret').value.trim();
  const markup = parseFloat(document.getElementById('markup').value) || 2.8;
  const p = winnersData[currentCat][index];
  const st = document.getElementById(`st-${currentCat}-${index}`);
  btn.disabled = true; btn.textContent = '上架緊...';
  try{
    const res = await fetch('/api/admin/auto-import', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ secret, pid: p.cjPid, cat: currentCat, markup })
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    setStatus(st, `✓ HK$${data.product.priceHKD} · 毛利約HK$${data.product.estGrossMarginHKD}。等約1分鐘部署完就live。`, 'ok');
    btn.textContent = '已上架 ✓';
    toast(`「${data.product.name}」上架成功!`,'ok');
  }catch(e){
    setStatus(st, '上架失敗:' + e.message, 'err');
    btn.disabled = false; btn.textContent = '一撳上架';
    toast('上架失敗:' + e.message,'err');
  }
}
</script>
</body>
</html>
